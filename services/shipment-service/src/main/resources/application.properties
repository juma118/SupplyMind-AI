quarkus.http.port=8083

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SHIPMENT_DB_USERNAME:supplymind}
quarkus.datasource.password=${SHIPMENT_DB_PASSWORD:supplymind}
quarkus.datasource.jdbc.url=${SHIPMENT_DB_URL:jdbc:postgresql://localhost:5432/shipment}

quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.shipment-events-out.connector=smallrye-kafka
mp.messaging.outgoing.shipment-events-out.topic=shipment.events.v1
mp.messaging.outgoing.shipment-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.oidc.auth-server-url=http://keycloak:8080/realms/supplymind
quarkus.oidc.token.issuer=http://localhost:8180/realms/supplymind
quarkus.oidc.client-id=shipment-service
quarkus.oidc.application-type=service
# Keycloak is configured with KC_HOSTNAME=http://localhost:8180 (so the "iss" claim in
# issued tokens is always the browser-facing address) - but that also makes its discovery
# document self-report jwks_uri as http://localhost:8180/..., which this container can't
# reach. Discovery itself succeeds (auth-server-url resolves fine in-network), but
# Quarkus then follows that self-reported jwks_uri and fails. Disabling discovery and
# pointing jwks-path directly at the in-network address - the same fix every other
# service already applies via its own jwk-set-uri/auth-server-url split - avoids it.
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=protocol/openid-connect/certs
# Keycloak nests realm roles under realm_access.roles, not the top-level "roles" claim
# @RolesAllowed expects by default.
quarkus.oidc.roles.role-claim-path=realm_access/roles

