server:
  port: 8082

spring:
  application:
    name: operations-service
  datasource:
    url: ${OPERATIONS_DB_URL:jdbc:postgresql://localhost:5432/operations}
    username: ${OPERATIONS_DB_USERNAME:supplymind}
    password: ${OPERATIONS_DB_PASSWORD:supplymind}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

operations:
  cors:
    allowed-origins: ${OPERATIONS_CORS_ORIGINS:http://localhost:4200}

aiops:
  keycloak:
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/supplymind/protocol/openid-connect/certs}
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/supplymind}
