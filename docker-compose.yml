services:
  postgres:
    # pgvector/pgvector:pg16 (Postgres 16 + the pgvector extension pre-built) instead of
    # plain postgres:16-alpine - README §5's RAG design calls for pgvector, and the
    # extension has to be baked into the image; it can't be `CREATE EXTENSION`-ed in
    # without the native library already present.
    image: pgvector/pgvector:pg16
    container_name: supplymind-postgres
    environment:
      POSTGRES_USER: supplymind
      POSTGRES_PASSWORD: supplymind
      POSTGRES_MULTIPLE_DATABASES: core,ai_operations,operations,shipment,keycloak
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplymind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: supplymind-redpanda
    # Two listeners: PLAINTEXT for other containers on the compose network (reached as
    # "redpanda:9092"), OUTSIDE for processes running on the host (reached as
    # "localhost:19092") - e.g. a service started locally via `mvn spring-boot:run`
    # instead of as a container. Advertising only one address breaks whichever side isn't
    # using it, since Kafka clients reconnect using the address the broker advertises.
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: supplymind-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: supplymind
      KC_DB_PASSWORD: supplymind
      KC_HEALTH_ENABLED: "true"
      # Fixed so every token's "iss" claim is always http://localhost:8180/realms/supplymind,
      # regardless of whether the request came from the browser (localhost:8180) or another
      # container reaching Keycloak in-network (keycloak:8080) - without this, Keycloak's
      # default request-based hostname would stamp a different issuer per caller, and the
      # jwk-set-uri/issuer split used by every resource server (Gateway, Operations Service,
      # AI Operations Service) would start rejecting tokens minted via the in-network address.
      KC_HOSTNAME: http://localhost:8180
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8180:8080"

  # The four services below publish no host ports under the "full" profile - the Gateway
  # is meant to be the only externally reachable entry point (README §4). Without a
  # published port, they're still reachable by other containers on the compose network
  # (core-service:8081 etc.), just not from the host/browser directly, which is what
  # actually makes "the Gateway derives tenant from the JWT" a real boundary instead of
  # a bypassable convenience - hitting a service's own port used to skip that entirely.
  # For local debugging, temporarily add back a "ports:" entry, or use
  # `docker exec supplymind-core-service ...` / `docker compose --profile full up` with
  # scripts/local-dev.sh's non-containerized mode instead, which still exposes every port.
  core-service:
    build: ./services/core-service
    container_name: supplymind-core-service
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORE_DB_URL: jdbc:postgresql://postgres:5432/core
      CORE_CORS_ORIGINS: http://localhost:4200

  operations-service:
    build: ./services/operations-service
    container_name: supplymind-operations-service
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPERATIONS_DB_URL: jdbc:postgresql://postgres:5432/operations
      OPERATIONS_CORS_ORIGINS: http://localhost:4200
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/supplymind/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8180/realms/supplymind

  shipment-service:
    build: ./services/shipment-service
    container_name: supplymind-shipment-service
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHIPMENT_DB_URL: jdbc:postgresql://postgres:5432/shipment
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SHIPMENT_CORS_ORIGINS: http://localhost:4200

  ai-operations-service:
    build: ./services/ai-operations-service
    container_name: supplymind-ai-operations-service
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      core-service:
        condition: service_started
      operations-service:
        condition: service_started
    environment:
      AIOPS_DB_URL: jdbc:postgresql://postgres:5432/ai_operations
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CORE_SERVICE_BASE_URL: http://core-service:8081
      OPERATIONS_SERVICE_BASE_URL: http://operations-service:8082
      AIOPS_CORS_ORIGINS: http://localhost:4200
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/supplymind/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8180/realms/supplymind
      # Browser-facing token endpoint works fine in-network too (Keycloak doesn't care
      # which address issued the request), but using the in-network host keeps this off
      # the host's published port entirely.
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/supplymind/protocol/openid-connect/token
      KEYCLOAK_SERVICE_CLIENT_ID: ai-operations-service
      KEYCLOAK_SERVICE_CLIENT_SECRET: ai-ops-service-secret
      # Pass ANTHROPIC_API_KEY / AIOPS_AI_MODE / OLLAMA_BASE_URL from the host shell
      # (docker compose forwards an unset-value env var through automatically) to pick
      # online vs. offline mode per README §5.1, without baking a key into the image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AIOPS_AI_MODE: ${AIOPS_AI_MODE:-online}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

  api-gateway:
    build: ./services/api-gateway
    container_name: supplymind-api-gateway
    profiles: ["full"]
    depends_on:
      keycloak:
        condition: service_started
      core-service:
        condition: service_started
      operations-service:
        condition: service_started
      shipment-service:
        condition: service_started
      ai-operations-service:
        condition: service_started
    environment:
      CORE_SERVICE_BASE_URL: http://core-service:8081
      OPERATIONS_SERVICE_BASE_URL: http://operations-service:8082
      SHIPMENT_SERVICE_BASE_URL: http://shipment-service:8083
      AI_OPERATIONS_SERVICE_BASE_URL: http://ai-operations-service:8084
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/supplymind/protocol/openid-connect/certs
      # The issuer must stay the browser-facing URL even though the Gateway itself reaches
      # Keycloak via the in-network address above - see GatewaySecurityConfig.
      KEYCLOAK_ISSUER: http://localhost:8180/realms/supplymind
      GATEWAY_CORS_ORIGINS: http://localhost:4200
    ports:
      - "8085:8085"

  web:
    build: ./apps/web
    container_name: supplymind-web
    profiles: ["full"]
    depends_on:
      - api-gateway
    ports:
      - "4200:80"

volumes:
  pg_data:
