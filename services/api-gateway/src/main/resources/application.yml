server:
  port: 8085

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: core-service
          uri: ${CORE_SERVICE_BASE_URL:http://localhost:8081}
          predicates:
            - Path=/core-service/**
          filters:
            - StripPrefix=1
        - id: operations-service
          uri: ${OPERATIONS_SERVICE_BASE_URL:http://localhost:8082}
          predicates:
            - Path=/operations-service/**
          filters:
            - StripPrefix=1
        - id: shipment-service
          uri: ${SHIPMENT_SERVICE_BASE_URL:http://localhost:8083}
          predicates:
            - Path=/shipment-service/**
          filters:
            - StripPrefix=1
        - id: ai-operations-service
          uri: ${AI_OPERATIONS_SERVICE_BASE_URL:http://localhost:8084}
          predicates:
            - Path=/ai-operations-service/**
          filters:
            - StripPrefix=1

# README §2: tenant comes from the verified JWT's tenant_id claim (see TenantHeaderGlobalFilter),
# which means the Gateway must validate tokens using its in-network path to Keycloak, while still
# expecting the browser-facing issuer value Keycloak actually stamps into every token.
aiops:
  keycloak:
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/supplymind/protocol/openid-connect/certs}
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/supplymind}
  cors:
    allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
