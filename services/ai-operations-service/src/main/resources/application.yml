server:
  port: 8084

spring:
  application:
    name: ai-operations-service
  datasource:
    url: ${AIOPS_DB_URL:jdbc:postgresql://localhost:5432/ai_operations}
    username: ${AIOPS_DB_USERNAME:supplymind}
    password: ${AIOPS_DB_PASSWORD:supplymind}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-operations-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AIOPS_OFFLINE_MODEL:qwen2.5:32b}
      embedding:
        options:
          model: ${AIOPS_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        # nomic-embed-text produces 768-dim vectors - must match whatever embedding
        # model is actually configured above, or every write fails at insert time.
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance
        initialize-schema: true
        schema-validation: false

# README §5.1: mode selects the primary provider path; AiGatewayService always falls back
# to the other mode, then to a deterministic rule-based result, before giving up.
aiops:
  ai:
    mode: ${AIOPS_AI_MODE:online}
    online:
      model: ${AIOPS_ONLINE_MODEL:claude-sonnet-5}
    offline:
      model: ${AIOPS_OFFLINE_MODEL:qwen2.5:32b}
  core-service:
    base-url: ${CORE_SERVICE_BASE_URL:http://localhost:8081}
  operations-service:
    base-url: ${OPERATIONS_SERVICE_BASE_URL:http://localhost:8082}
  keycloak:
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/supplymind/protocol/openid-connect/certs}
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/supplymind}
    # Used by KeycloakServiceTokenProvider to authenticate this service's own calls to
    # Operations Service as the "system-service" client-credentials principal - see
    # SecurityConfig in both services and the realm's "ai-operations-service" client.
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/supplymind/protocol/openid-connect/token}
    client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:ai-operations-service}
    client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:ai-ops-service-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
